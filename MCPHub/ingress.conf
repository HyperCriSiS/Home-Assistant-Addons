server {
    listen 8099;

    # Home Assistant documents 172.30.32.2 as the fixed Supervisor Ingress
    # source inside the managed App network. This is not a user's LAN address.
    # Keep this exact restriction: arbitrary LAN/App clients must not be able
    # to spoof Home Assistant identity headers through the Ingress adapter.
    allow 172.30.32.2;
    deny all;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 16m;

    # MCPHub needs its external base path for browser API requests.
    # Home Assistant supplies the dynamic Ingress path in this header.
    location = /config {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 200 "{\"success\":true,\"data\":{\"basePath\":\"$http_x_ingress_path\",\"version\":\"1.1.5\",\"name\":\"MCPHub\"}}";
    }

    # Available only via authenticated Home Assistant Ingress, never directly
    # from the LAN or the Cloudflare / OpenAI tunnel origins.
    location ^~ /_mcphub_tunnel/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Accessible only via authenticated Home Assistant Supervisor Ingress.
    location ^~ /_mcphub_tunnels/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Home Assistant Supervisor authenticates the user and injects
        # X-Remote-User-* identity headers. A private proxy secret ensures
        # MCPHub trusts those headers only when they came through this adapter.
        proxy_set_header X-MCPHub-HA-Proxy-Secret "__HA_INGRESS_PROXY_SECRET__";
        proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
        proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
        proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

        # Preserve WebSockets and streamed MCP responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

__HOME_ASSISTANT_MCP_SERVER_BLOCK__

__CLOUDFLARE_SERVER_BLOCK__

__TAILSCALE_SERVER_BLOCK__

# Direct native MCPHub access, available only when Home Assistant publishes
# 3001/tcp on an optional host port. Uses MCPHub's own login and bearer keys.
server {
    listen 3001;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # A LAN client must NEVER be trusted as a Supervisor Ingress session.
        proxy_set_header X-MCPHub-HA-Proxy-Secret "";
        proxy_set_header X-Remote-User-Id "";
        proxy_set_header X-Remote-User-Name "";
        proxy_set_header X-Remote-User-Display-Name "";
        proxy_set_header X-Remote-User-Email "";
        proxy_set_header X-Remote-User-Groups "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Proxy-Authorization "";

        # Native MCPHub Authorization (bearer) passes through unchanged.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
