server {
    listen 8099;

    # Home Assistant Ingress is the only allowed dashboard entry point.
    allow 172.30.32.2;
    deny all;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 16m;

    # MCPHub needs its external base path for browser API requests.
    # Home Assistant supplies the dynamic Ingress path in this header.
    location = /config {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 200 "{\"success\":true,\"data\":{\"basePath\":\"$http_x_ingress_path\",\"version\":\"1.1.0\",\"name\":\"MCPHub\"}}";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Home Assistant Ingress authenticates the user. This private key
        # authenticates the trusted local proxy to MCPHub itself.
        proxy_set_header Authorization "__INGRESS_AUTHORIZATION__";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

        # Preserve WebSockets and streamed MCP responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

__CLOUDFLARE_SERVER_BLOCK__
