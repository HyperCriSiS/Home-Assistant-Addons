---
name: "MCPHub"
version: "v2026.10.12-1"
slug: mcphub
description: >-
  MCPHub 1.1.3 - central MCP server management with optional Home Assistant,
  OpenAI and Cloudflare integrations
url: "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/main/MCPHub"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:hub
panel_title: MCPHub
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/health"
homeassistant_api: true
backup: cold
# Explicitly no published TCP ports: Tailscale origins are Unix sockets.
ports: {}
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
options:
  openai:
    tunnel_enabled: false
    openai_runtime_api_key: ""
    tunnel_id: ""
    tunnel_mcp_path: "/mcp"
  cloudflare:
    cloudflare_tunnel_enabled: false
    cloudflare_tunnel_token: ""
    cloudflare_mcp_path: "/mcp"
    cloudflare_access_token: ""
  tailscale:
    tailscale_serve_enabled: false
    tailscale_serve_mcp_path: "/mcp"
    tailscale_serve_access_token: ""
    tailscale_funnel_enabled: false
    tailscale_funnel_mcp_path: "/mcp"
    tailscale_funnel_access_token: ""
  home_assistant:
    home_assistant_mcp_enabled: false
    home_assistant_mcp_server_name: "ha-home-assistant"
    home_assistant_mcp_auth_mode: "restricted_user"
    home_assistant_mcp_user_token: ""
    home_assistant_mcp_url: "http://homeassistant:8123/api/mcp"
    home_assistant_mcp_ca_file: ""
  github:
    github_cli_mcp_enabled: false
    github_token: ""
  logging:
    tunnel_log_level: "info"
schema:
  openai:
    tunnel_enabled: bool
    openai_runtime_api_key: password
    tunnel_id: str
    tunnel_mcp_path: str
  cloudflare:
    cloudflare_tunnel_enabled: bool
    cloudflare_tunnel_token: password
    cloudflare_mcp_path: str
    cloudflare_access_token: password
  tailscale:
    tailscale_serve_enabled: bool
    tailscale_serve_mcp_path: str
    tailscale_serve_access_token: password
    tailscale_funnel_enabled: bool
    tailscale_funnel_mcp_path: str
    tailscale_funnel_access_token: password
  home_assistant:
    home_assistant_mcp_enabled: bool
    home_assistant_mcp_server_name: str
    home_assistant_mcp_auth_mode: "list(supervisor|restricted_user)"
    home_assistant_mcp_user_token: password
    home_assistant_mcp_url: str
    home_assistant_mcp_ca_file: str?
  github:
    github_cli_mcp_enabled: bool
    github_token: password
  logging:
    tunnel_log_level: "list(debug|info|warn)"
