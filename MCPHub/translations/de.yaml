---
configuration:
  openai:
    name: "OpenAI Secure Tunnel"
    description: "Einstellungen für OpenAI Secure Tunnel"
    fields:
      tunnel_enabled:
        name: "OpenAI Secure MCP Tunnel aktivieren"
        description: "Verbindet den gewählten MCPHub-Endpunkt mit ChatGPT und unterstützten OpenAI-Clients."
      openai_runtime_api_key:
        name: "OpenAI Runtime API Key"
        description: >-
          Runtime-Key für Secure MCP Tunnel. Restricted-Key mit Tunnels Read + Use
          erstellen: https://platform.openai.com/settings/organization/api-keys
      tunnel_id:
        name: "OpenAI Tunnel-ID"
        description: >-
          Die Tunnel-ID beginnt mit tunnel_. Du findest sie in den OpenAI-Tunnel-Einstellungen:
          https://platform.openai.com/settings/organization/tunnels
      tunnel_mcp_path:
        name: "OpenAI MCP-Route"
        description: "MCPHub-Endpunkt für ChatGPT, zum Beispiel /mcp, /mcp/$smart oder /mcp/<gruppe>."
  cloudflare:
    name: "Cloudflare Tunnel"
    description: "Einstellungen für Cloudflare Tunnel"
    fields:
      cloudflare_tunnel_enabled:
        name: "Cloudflare Tunnel aktivieren"
        description: "Stellt eine gewählte MCPHub-Route über Cloudflare bereit."
      cloudflare_tunnel_token:
        name: "Cloudflare Tunnel-Token"
        description: >-
          Connector-Token im Cloudflare Dashboard unter Networking → Tunnels.
      cloudflare_mcp_path:
        name: "Cloudflare MCP-Route"
        description: "Die über Cloudflare bereitgestellte MCPHub-Route."
  tailscale:
    name: "Tailscale Funnel"
    description: "Verwendet das vorhandene Home-Assistant-Tailscale-Add-on. Funnel wird dort eingerichtet."
    fields:
      tailscale_funnel_enabled:
        name: "Tailscale MCP-Gateway aktivieren"
        description: >-
          Aktiviert einen eigenen, nur auf MCP beschränkten Proxy mit Bearer-Schutz.
          Zusätzlich unter Netzwerk den Host-Port 3002 ausdrücklich freigeben und
          Funnel manuell im vorhandenen Tailscale-Add-on einrichten.
      tailscale_mcp_path:
        name: "Tailscale MCP-Route"
        description: "Exakte MCPHub-Route, zum Beispiel /mcp oder /mcp/home."
      tailscale_funnel_url:
        name: "Öffentliche Tailscale-Funnel-URL (optional)"
        description: >-
          HTTPS-Adresse aus tailscale funnel status einschließlich MCP-Route,
          z. B. https://node.tailnet.ts.net/mcp. Dient nur einer Prüfung ohne Zugangsdaten.
  home_assistant:
    name: "Home Assistant MCP"
    description: "Einstellungen für Home Assistant MCP"
    fields:
      home_assistant_mcp_enabled:
        name: "Verwaltetes Home Assistant MCP aktivieren"
        description: >-
          Fügt den Home Assistant MCP Server über eine nur lokal erreichbare Bridge
          zu MCPHub hinzu. Die MCP-Server-Integration muss in Home Assistant bereits
          eingerichtet sein.
      home_assistant_mcp_server_name:
        name: "Home Assistant MCP-Servername"
        description: >-
          Name des automatisch registrierten Servers in MCPHub (Standard: ha-home-assistant).
          Muss eindeutig sein. Eine Umbenennung kann bestehende MCPHub-Gruppen betreffen.
      home_assistant_mcp_auth_mode:
        name: "Home Assistant MCP-Authentifizierung"
        description: >-
          restricted_user verwendet den Token eines separaten Home-Assistant-
          Benutzers. supervisor verwendet automatisch den Supervisor-Token.
      home_assistant_mcp_user_token:
        name: "Token des separaten Home-Assistant-Benutzers"
        description: >-
          Long-Lived Access Token, der angemeldet als der separate Home-Assistant-
          Benutzer erstellt wurde. Wird nur bei restricted_user verwendet.
      home_assistant_mcp_url:
        name: "Home Assistant MCP-URL"
        description: >-
          Direkter Home-Assistant-MCP-Endpunkt für restricted_user. Unterstützt
          erreichbare LAN-IPs, IPv6, lokale DNS-Namen, eigene Ports und HTTPS.
      home_assistant_mcp_ca_file:
        name: "Home Assistant HTTPS-CA-Datei (optional)"
        description: >-
          Nur bei HTTPS mit eigener CA: vertrauenswürdige PEM-Datei unter /ssl,
          z. B. /ssl/home-assistant-ca.pem. Für HTTP oder öffentliches HTTPS leer lassen.
  github:
    name: "GitHub CLI MCP-Server"
    description: "Einstellungen für GitHub CLI MCP-Server"
    fields:
      github_cli_mcp_enabled:
        name: "GitHub CLI MCP aktivieren"
        description: >-
          Installiert GitHub CLI bei Bedarf persistent und fügt automatisch den
          universellen gh-cli-mcp-server zu MCPHub hinzu.
      github_token:
        name: "GitHub Token"
        description: >-
          Optionaler GitHub Personal Access Token für authentifizierte gh-Befehle.
          Für private Repositories und Schreibzugriffe erforderlich.
  logging:
    name: "Protokollierung"
    description: "Einstellungen für Protokollierung"
    fields:
      tunnel_log_level:
        name: "OpenAI Tunnel-Log-Level"
        description: "Ausführlichkeit der OpenAI-tunnel-client-Logs."
