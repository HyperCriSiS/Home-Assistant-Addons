---
configuration:
  tunnel_enabled:
    name: "Enable OpenAI tunnel"
    description: "Connect the selected MCPHub endpoint to ChatGPT through OpenAI Secure MCP Tunnel."
  openai_runtime_api_key:
    name: "OpenAI Runtime API Key"
    description: "Runtime key used by Secure MCP Tunnel. Leave empty while using MCPHub without the tunnel."
  tunnel_id:
    name: "OpenAI Tunnel ID"
    description: "Tunnel ID created for OpenAI Secure MCP Tunnel."
  tunnel_mcp_path:
    name: "MCPHub tunnel route"
    description: "MCPHub endpoint exposed to ChatGPT, for example /mcp, /mcp/$smart, or /mcp/<group>."
  tunnel_log_level:
    name: "Tunnel log level"
    description: "Verbosity of the OpenAI tunnel-client logs."
