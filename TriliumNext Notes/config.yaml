---
name: "Trilium Notes (Dev)"
version: "v2026.10.11-dev.68"
slug: trilium
description: >-
  Trilium v0.106.0 - hierarchical note-taking and personal knowledge base.
url: "https://github.com/HyperCriSiS/Home-Assistant-Addons/tree/dev-trilium/TriliumNext%20Notes"
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:notebook-multiple
panel_title: "Trilium Notes (Dev)"
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "tcp://[HOST]:[PORT:8080]"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
map:
  - type: data
    read_only: false
    path: /home/node/trilium-data
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": "Trilium web interface (not required for Ingress)"
options:
  timezone: "Europe/Berlin"
  log_retention_days: 90
schema:
  timezone: str
  log_retention_days: "int(1,3650)"
  # Kept temporarily for compatibility with existing installations.
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  https_only: "bool?"
environment:
  TRILIUM_DATA_DIR: "/home/node/trilium-data"
  TRILIUM_NETWORK_HOST: "0.0.0.0"
  TRILIUM_NETWORK_PORT: "8080"
  TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: "172.30.32.2"
  TRILIUM_LOGGING_RETENTIONDAYS: "${{ options.log_retention_days }}"
  TZ: "${{ options.timezone }}"
