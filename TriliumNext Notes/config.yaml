---
name: "Trilium Notes"
version: "v2026.07.26"
slug: trilium
description: >-
  Hierarchical note-taking application with encryption, Markdown support,
  synchronization, and personal knowledge base features.
url: "https://github.com/HyperCriSiS/Home-Assistant-Addons"
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:notebook-multiple
panel_title: Trilium Notes
webui: "http://[HOST]:[PORT:8080]/"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: data
    read_only: false
    path: /home/node/trilium-data
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": "Trilium web interface (not required for Ingress)"
options:
  timezone: "Europe/Berlin"
  log_retention_days: 90
schema:
  timezone: str
  log_retention_days: "int(1,3650)"
  # Kept temporarily for compatibility with existing installations.
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  https_only: "bool?"
environment:
  TRILIUM_DATA_DIR: "/home/node/trilium-data"
  TRILIUM_NETWORK_HOST: "0.0.0.0"
  TRILIUM_NETWORK_PORT: "8080"
  TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: "true"
  TRILIUM_LOGGING_RETENTIONDAYS: "{{ options.log_retention_days }}"
  TZ: "{{ options.timezone }}"
