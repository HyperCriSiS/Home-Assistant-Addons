---
version: 2
updates:
  # Trilium Docker updates are handled by .github/workflows/update-trilium.yml so
  # the app version, changelog, full CI, and dev-store promotion stay atomic.
  - package-ecosystem: docker
    directory: "/MCPHub"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/.github/tests/e2e"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
