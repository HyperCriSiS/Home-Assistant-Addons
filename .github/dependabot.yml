---
version: 2
updates:
  - package-ecosystem: docker
    directory: "/MCPHub"
    target-branch: dev-mcphub
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/.github/tests/e2e"
    target-branch: dev-trilium
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Shared workflow dependencies are infrastructure, not an app release.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
