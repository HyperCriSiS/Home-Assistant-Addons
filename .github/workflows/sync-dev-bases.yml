---
name: Sync development branch bases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-development-branch-bases
  cancel-in-progress: false

jobs:
  sync:
    name: Merge stable main into app development branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync app development branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in dev-trilium dev-mcphub; do
            if ! git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "${branch} does not exist yet; skipping"
              continue
            fi

            git fetch origin main "${branch}"
            git checkout -B "${branch}" "origin/${branch}"

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "${branch} already contains current main"
              continue
            fi

            git merge --no-ff --no-edit origin/main
            git push origin "HEAD:${branch}"
          done
