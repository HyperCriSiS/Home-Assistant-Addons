---
name: Update Trilium

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-trilium
  cancel-in-progress: false

jobs:
  update:
    name: Detect, validate and promote Trilium updates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}

    steps:
      - name: Check out Trilium development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev-trilium
          fetch-depth: 0
          persist-credentials: false

      - name: Detect latest stable Trilium release
        id: version
        run: |
          current="$(sed -nE 's#^FROM docker\.io/triliumnext/trilium:(v[^[:space:]]+)$#\1#p' \
            'TriliumNext Notes/Dockerfile')"
          latest="$(gh api repos/TriliumNext/Trilium/releases/latest --jq '.tag_name')"

          if [[ -z "${current}" || -z "${latest}" ]]; then
            echo "Could not determine current/latest Trilium version" >&2
            exit 1
          fi

          echo "Current: ${current}"
          echo "Latest:  ${latest}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

          if [[ "${current}" == "${latest}" ]]; then
            echo "update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "update=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify upstream image before changing files
        if: steps.version.outputs.update == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: docker manifest inspect "docker.io/triliumnext/trilium:${LATEST}" >/dev/null

      - name: Update add-on files
        if: steps.version.outputs.update == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: python3 .github/scripts/update_trilium.py --upstream "${LATEST}"

      - name: Create update branch and optional pull request
        if: steps.version.outputs.update == 'true'
        id: update
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          branch="automation/trilium-${LATEST}"
          base_sha="$(git rev-parse HEAD)"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${branch}"
          git add 'TriliumNext Notes/Dockerfile' \
            'TriliumNext Notes/config.yaml' \
            'TriliumNext Notes/CHANGELOG.md'
          git commit -m "chore: update Trilium to ${LATEST}"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "${remote}" "HEAD:refs/heads/${branch}"

          existing="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base dev-trilium \
            --head "${branch}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          pr_number="${existing}"
          if [[ -z "${pr_number}" ]]; then
            body="$(printf \
              'Automated Trilium update to %s. Full CI must pass before promotion to dev-trilium.\n\nUpstream: %s\n' \
              "${LATEST}" \
              "https://github.com/TriliumNext/Trilium/releases/tag/${LATEST}")"

            if pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base dev-trilium \
              --head "${branch}" \
              --title "chore: update Trilium to ${LATEST}" \
              --body "${body}" 2>/tmp/trilium-pr-error)"; then
              pr_number="${pr_url##*/}"
            else
              cat /tmp/trilium-pr-error >&2
              echo "GitHub Actions PR creation is disabled; validated fast-forward fallback will be used."
            fi
          fi

          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch full validation for update branch
        if: steps.version.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.update.outputs.branch }}
        run: gh workflow run validate.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"

      - name: Wait for update validation
        if: steps.version.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow validate.yml \
              --branch "${BRANCH}" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            [[ -n "${run_id}" ]] && break
            sleep 2
          done

          [[ -n "${run_id}" ]] || { echo "Validation run did not start" >&2; exit 1; }
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status

      - name: Promote validated update into dev-trilium
        if: steps.version.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.update.outputs.branch }}
          BASE_SHA: ${{ steps.update.outputs.base_sha }}
          PR_NUMBER: ${{ steps.update.outputs.number }}
        run: |
          current_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev-trilium" --jq '.object.sha')"
          if [[ "${current_dev}" != "${BASE_SHA}" ]]; then
            echo "dev-trilium changed during validation; refusing to promote stale update" >&2
            exit 1
          fi

          promoted=false
          if [[ -n "${PR_NUMBER}" ]]; then
            if gh pr merge "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --squash \
              --delete-branch; then
              promoted=true
            else
              echo "PR merge failed; using validated fast-forward fallback." >&2
            fi
          fi

          if [[ "${promoted}" != "true" ]]; then
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "${remote}" "refs/heads/${BRANCH}:refs/heads/dev-trilium"
            git push "${remote}" --delete "${BRANCH}" || true
          fi

          # GITHUB_TOKEN-generated repository events do not recursively start workflows.
          # Explicit dispatch keeps validation, the development store, and release promotion in sync.
          gh workflow run validate.yml --repo "${GITHUB_REPOSITORY}" --ref dev-trilium
          gh workflow run sync-dev-store.yml --repo "${GITHUB_REPOSITORY}" --ref main