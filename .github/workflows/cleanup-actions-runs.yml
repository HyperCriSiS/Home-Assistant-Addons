name: Cleanup old Actions runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the newest 10 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id')
          echo "Found ${#run_ids[@]} runs"
          if (( ${#run_ids[@]} <= 10 )); then
            exit 0
          fi
          for run_id in "${run_ids[@]:10}"; do
            echo "Deleting run ${run_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done
          echo "Kept the newest 10 runs."
