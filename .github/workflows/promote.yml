---
name: Promote dev to main

on:
  workflow_run:
    workflows:
      - Validate add-on
      - Validate MCPHub
      - HAOS integration
      - HAOS MCPHub integration
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-main
  cancel-in-progress: false

jobs:
  promote:
    name: Maintain release pull request
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'dev'
        )
      }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Verify validation gates for current dev commit
        id: gates
        shell: bash
        run: |
          dev_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          ready=true

          require_success() {
            local workflow="$1"
            local label="$2"
            local conclusion

            conclusion="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${workflow}" \
              --branch dev \
              --commit "${dev_sha}" \
              --status completed \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // empty')"

            if [[ "${conclusion}" != "success" ]]; then
              echo "${label} is not successful for dev commit ${dev_sha}: ${conclusion:-not completed}"
              ready=false
            else
              echo "${label} passed for dev commit ${dev_sha}"
            fi
          }

          require_success "validate.yml" "Trilium validation"
          require_success "validate-mcphub.yml" "MCPHub validation"

          if [[ "${HAOS_E2E_ENABLED:-false}" == "true" ]]; then
            require_success "haos-integration.yml" "Trilium HAOS integration"
            require_success "haos-mcphub.yml" "MCPHub HAOS integration"
          fi

          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"
        env:
          HAOS_E2E_ENABLED: ${{ vars.HAOS_E2E_ENABLED }}

      - name: Create or update dev to main pull request
        id: pr
        if: steps.gates.outputs.ready == 'true'
        run: |
          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "${pr_number}" ]]; then
            if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq '.ahead_by')" == "0" ]]; then
              echo "dev has nothing to promote"
              exit 0
            fi

            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head dev \
              --title "chore: promote validated dev to main" \
              --body "Automated release PR. The current dev commit passed all configured add-on validation gates.")"
            pr_number="${pr_url##*/}"
          fi

          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Enable automatic release to main
        if: steps.pr.outputs.number != '' && vars.AUTO_RELEASE_TO_MAIN == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --merge \
            --auto
