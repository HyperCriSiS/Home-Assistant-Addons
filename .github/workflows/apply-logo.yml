---
name: Apply transparent Trilium logo

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-logo.yml

permissions:
  actions: write
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Replace logo and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '' | base64 --decode > 'TriliumNext Notes/logo.png'
          echo 'e99ddda3baa3c5c27d60205420c55a1aa71a6d5faebbc8afbb657935e3720b94  TriliumNext Notes/logo.png' | sha256sum -c -
          test "$(head -c 8 'TriliumNext Notes/logo.png' | xxd -p)" = '89504e470d0a1a0a'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-logo.yml'
          git add 'TriliumNext Notes/logo.png'
          git commit -m 'Use transparent Trilium logo'
          git push origin HEAD:dev
          gh workflow run validate.yml --ref dev
