---
name: Validate MCPHub

on:
  pull_request:
    paths:
      - "MCPHub/**"
      - ".github/scripts/integration-test-mcphub.sh"
      - ".github/scripts/haos-e2e-mcphub.sh"
      - ".github/scripts/update-mcphub-upstream.py"
      - ".github/workflows/**"
      - ".yamllint"
  push:
    branches:
      - main
      - dev-mcphub
    paths:
      - "MCPHub/**"
      - ".github/scripts/integration-test-mcphub.sh"
      - ".github/scripts/haos-e2e-mcphub.sh"
      - ".github/scripts/update-mcphub-upstream.py"
      - ".github/workflows/**"
      - ".yamllint"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mcphub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and integration-test MCPHub
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            'pyyaml==6.0.2' \
            'yamllint==1.37.1'

      - name: Lint MCPHub YAML
        run: |
          find "MCPHub" \
            -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -print0 \
            | xargs -0 yamllint

      - name: Lint MCPHub shell scripts
        run: |
          shellcheck "MCPHub/run.sh"
          shellcheck "MCPHub/github_cli_mcp.sh"
          shellcheck ".github/scripts/integration-test-mcphub.sh"
          shellcheck ".github/scripts/haos-e2e-mcphub.sh"

      - name: Compile MCPHub Python helpers
        run: |
          python3 -m py_compile "MCPHub/prepare_config.py"
          python3 -m py_compile "MCPHub/prepare_proxy_config.py"
          python3 -m py_compile "MCPHub/patch_home_assistant_auth.py"
          python3 -m py_compile ".github/scripts/update-mcphub-upstream.py"
          python3 -m py_compile ".github/scripts/generate-mcphub-changelog.py"

      - name: Test managed Home Assistant MCP server lifecycle
        run: python3 -m unittest discover -s MCPHub/tests -p 'test_*.py' -v

      - name: Require complete MCPHub release notes for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch origin main dev-mcphub
          if ! git diff --quiet origin/main HEAD -- MCPHub; then
            python3 .github/scripts/generate-mcphub-changelog.py stable --check
          fi

      - name: Lint MCPHub Dockerfile
        run: |
          image="ghcr.io/hadolint/hadolint:v2.15.0-debian"
          digest="sha256:cc00266a16707bbbdfd29517cccd76164ac46a956e2ba8222515df5691fa54b5"
          docker run --rm -i "${image}@${digest}" \
            hadolint \
            --ignore DL3002 \
            --ignore DL3006 \
            --ignore DL3008 \
            --ignore DL3066 \
            - < "MCPHub/Dockerfile"

      - name: Validate MCPHub metadata
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import re
          import yaml

          config = yaml.safe_load(Path("MCPHub/config.yaml").read_text(encoding="utf-8"))
          build = yaml.safe_load(Path("MCPHub/build.yaml").read_text(encoding="utf-8"))
          changelog = Path("MCPHub/CHANGELOG.md").read_text(encoding="utf-8")

          assert config["name"] == "MCPHub"
          assert config["slug"] == "mcphub"
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert "image" not in config
          assert config["ingress"] is True
          assert config["ingress_port"] == 8099
          assert config["panel_admin"] is True
          assert config["homeassistant_api"] is True
          assert config["watchdog"] == "http://[HOST]:[PORT:8099]/health"

          version = config["version"]
          match = re.fullmatch(r"(v\d{4}\.\d{2}\.\d{2})(?:-([1-9]\d*))?", version)
          assert match is not None, (
              "MCPHub version must use vYYYY.MM.DD or vYYYY.MM.DD-N"
          )
          datetime.strptime(match.group(1), "v%Y.%m.%d")
          assert changelog.startswith(f"# Changelog\n\n## {version}\n")

          groups = ["openai", "cloudflare", "tailscale", "home_assistant", "github", "logging"]
          assert list(config["options"]) == groups
          assert list(config["schema"]) == groups
          for group in groups:
              assert isinstance(config["options"][group], dict)
              assert list(config["options"][group]) == list(config["schema"][group])

          home_assistant = config["options"]["home_assistant"]
          assert home_assistant["home_assistant_mcp_enabled"] is False
          assert home_assistant["home_assistant_mcp_server_name"] == "ha-home-assistant"
          assert (
              config["schema"]["home_assistant"]["home_assistant_mcp_auth_mode"]
              == "list(supervisor|restricted_user)"
          )
          assert home_assistant["home_assistant_mcp_auth_mode"] == "restricted_user"
          assert home_assistant["home_assistant_mcp_url"] == "http://homeassistant:8123/api/mcp"
          assert config["options"]["openai"]["tunnel_enabled"] is False
          assert config["options"]["cloudflare"]["cloudflare_tunnel_enabled"] is False
          assert config["options"]["cloudflare"]["cloudflare_mcp_path"] == "/mcp"
          assert config["options"]["tailscale"]["tailscale_funnel_enabled"] is False
          assert config["options"]["tailscale"]["tailscale_mcp_path"] == "/mcp"
          assert config["ports"]["3002/tcp"] is None
          assert list(config["options"]["logging"])[-1] == "tunnel_log_level"
          assert list(config["schema"]["logging"])[-1] == "tunnel_log_level"

          build_images = set(build["build_from"].values())
          assert len(build_images) == 1, (
              f"MCPHub build_from must use one pinned image: {sorted(build_images)}"
          )
          upstream_image = build_images.pop()
          upstream_match = re.fullmatch(
              r"(?:docker[.]io/)?samanhappy/mcphub:([0-9]+[.][0-9]+[.][0-9]+)",
              upstream_image,
          )
          assert upstream_match is not None, (
              f"Unexpected MCPHub image: {upstream_image}"
          )
          upstream_version = upstream_match.group(1)

          assert config["description"] == (
              f"MCPHub {upstream_version} - central MCP server management "
              "with optional Home Assistant, OpenAI and Cloudflare integrations"
          ), "MCPHub description must match the packaged upstream image version"

          import os
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"MCPHUB_VERSION={version}", file=env_file)
              print(f"MCPHUB_UPSTREAM_VERSION={upstream_version}", file=env_file)
          PY

      - name: Validate upstream image architectures
        run: |
          docker manifest inspect \
            "docker.io/samanhappy/mcphub:${MCPHUB_UPSTREAM_VERSION}" \
            > /tmp/mcphub-manifest.json
          # Read the exact tested image tags from the same Dockerfile that
          # Buildx uses. Hardcoded versions silently test the wrong releases.
          eval "$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("MCPHub/Dockerfile").read_text(encoding="utf-8")
          for name, pattern in (
              ("OPENAI_TUNNEL_VERSION", r"v[0-9]+[.][0-9]+[.][0-9]+"),
              ("CLOUDFLARED_VERSION", r"[0-9]{4}[.][0-9]+[.][0-9]+"),
          ):
              match = re.search(rf"^ARG {name}=({pattern})$", text, re.M)
              if not match:
                  raise SystemExit(f"Unexpected or missing {name} pin")
              print(f"{name}={match.group(1)}")
          PY
          )"
          docker manifest inspect \
            "ghcr.io/openai/tunnel-client:${OPENAI_TUNNEL_VERSION}" > /tmp/tunnel-manifest.json
          docker manifest inspect \
            "docker.io/cloudflare/cloudflared:${CLOUDFLARED_VERSION}" > /tmp/cloudflared-manifest.json

          python3 - <<'PY'
          import json

          required = {"amd64", "arm64"}

          for name, path in (
              ("MCPHub", "/tmp/mcphub-manifest.json"),
              ("OpenAI tunnel-client", "/tmp/tunnel-manifest.json"),
              ("Cloudflare cloudflared", "/tmp/cloudflared-manifest.json"),
          ):
              with open(path, encoding="utf-8") as handle:
                  manifest = json.load(handle)

              arches = {
                  item.get("platform", {}).get("architecture")
                  for item in manifest.get("manifests", [])
                  if item.get("platform", {}).get("os") == "linux"
              }
              missing = required - arches
              if missing:
                  raise SystemExit(
                      f"{name} is missing required Linux architectures: "
                      + ", ".join(sorted(missing))
                  )
              print(f"{name} Linux architectures: {sorted(arches)}")
          PY

      - name: Validate amd64 and aarch64 builds
        run: |
          docker buildx create \
            --driver docker-container \
            --name mcphub-ci \
            --use

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=amd64 \
            --output type=cacheonly \
            "MCPHub"

          docker buildx build \
            --pull \
            --platform linux/arm64 \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=aarch64 \
            --output type=cacheonly \
            "MCPHub"

      - name: Build native MCPHub test image
        run: |
          docker build --pull \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=amd64 \
            --tag mcphub-addon:test \
            "MCPHub"

      - name: Verify bundled clients
        run: |
          docker run --rm --entrypoint /usr/local/bin/cloudflared mcphub-addon:test version
          docker run --rm --entrypoint /usr/local/bin/tunnel-client mcphub-addon:test --version
          docker run --rm --entrypoint /usr/local/bin/gh mcphub-addon:test --version \
            | grep -q 'gh version 2.101.0'
          docker run --rm -i \
            --entrypoint /opt/gh-cli-mcp/bin/python \
            mcphub-addon:test - <<'PY'
          import importlib.metadata as md
          from gh_cli_mcp_server.server import mcp

          assert mcp is not None
          assert md.version("gh-cli-mcp-server") == "0.3.0"
          assert md.version("mcp") == "1.30.0"
          PY

      - name: Smoke-test GitHub CLI MCP server
        run: |
          docker run --rm -i --entrypoint /usr/bin/python3 mcphub-addon:test - <<'PY'
          import subprocess
          import time

          proc = subprocess.Popen(
              ["/usr/local/bin/github_cli_mcp.sh"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          try:
              time.sleep(2)
              if proc.poll() is not None:
                  stdout, stderr = proc.communicate(timeout=1)
                  raise SystemExit(
                      "GitHub CLI MCP server exited during startup "
                      f"with code {proc.returncode}\nstdout:\n{stdout}\nstderr:\n{stderr}"
                  )
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=3)

          stderr = proc.stderr.read() if proc.stderr else ""
          if "Starting gh-cli-mcp-server 0.3.0" not in stderr:
              raise SystemExit(f"Unexpected GitHub CLI MCP stderr:\n{stderr}")
          PY

      - name: Validate Home Assistant MCP bridge modes
        run: |
          data_dir="$(mktemp -d)"
          mkdir -p "${data_dir}/secrets" "${data_dir}/mcphub"
          printf 'ingress-test-secret\n' > "${data_dir}/secrets/mcphub_ha_ingress_proxy_secret"
          printf 'cloudflare-test-secret\n' > "${data_dir}/secrets/mcphub_cloudflare_token"

          cat > "${data_dir}/options.json" <<'EOF'
          {
            "home_assistant_mcp_enabled": true,
            "home_assistant_mcp_auth_mode": "restricted_user",
            "home_assistant_mcp_user_token": "eyJtest_restricted_user_token_0123456789",
            "home_assistant_mcp_url": "http://127.0.0.1:8123/api/mcp"
          }
          EOF

          docker run --rm \
            --entrypoint /bin/bash \
            --volume "${data_dir}:/data" \
            mcphub-addon:test \
            -c '/usr/local/bin/prepare_mcphub_config.py &&
                /usr/local/bin/prepare_proxy_config.py &&
                grep -q "listen 127.0.0.1:8097" /etc/nginx/conf.d/mcphub.conf &&
                grep -q "proxy_pass http://127.0.0.1:8123/api/mcp" /etc/nginx/conf.d/mcphub.conf &&
                grep -q "ha-home-assistant" /data/mcphub/mcp_settings.json'

          cat > "${data_dir}/options.json" <<'EOF'
          {
            "home_assistant_mcp_enabled": true,
            "home_assistant_mcp_auth_mode": "supervisor"
          }
          EOF

          docker run --rm \
            --env SUPERVISOR_TOKEN="eyJtest_supervisor_token_0123456789" \
            --entrypoint /bin/bash \
            --volume "${data_dir}:/data" \
            mcphub-addon:test \
            -c '/usr/local/bin/prepare_mcphub_config.py &&
                /usr/local/bin/prepare_proxy_config.py &&
                grep -q "proxy_pass http://supervisor/core/api/mcp" /etc/nginx/conf.d/mcphub.conf'


          docker run --rm -i --entrypoint /usr/bin/python3 mcphub-addon:test - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("/usr/local/bin/prepare_proxy_config.py")
          spec = importlib.util.spec_from_file_location("proxy_config", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          cases = {
              "http://192.168.1.20:8123/api/mcp":
                  "http://192.168.1.20:8123/api/mcp",
              "http://10.20.30.40:8123/api/mcp/custom":
                  "http://10.20.30.40:8123/api/mcp/custom",
              "http://172.20.1.20:8123/api/mcp":
                  "http://172.20.1.20:8123/api/mcp",
              "http://[fd00::1234]:8123/api/mcp":
                  "http://[fd00::1234]:8123/api/mcp",
              "https://ha.internal.example/api/mcp":
                  "https://ha.internal.example/api/mcp",
          }
          for value, expected in cases.items():
              actual = module.validate_home_assistant_mcp_url(value)
              assert actual == expected, (value, actual, expected)

          rejected = (
              "ftp://192.168.1.20/api/mcp",
              "http://user:pass@192.168.1.20:8123/api/mcp",
              "http://192.168.1.20:8123/api/mcp?token=x",
              "http://192.168.1.20:8123/not-mcp",
          )
          for value in rejected:
              try:
                  module.validate_home_assistant_mcp_url(value)
              except ValueError:
                  pass
              else:
                  raise AssertionError(
                      f"Unsafe Home Assistant MCP URL accepted: {value}"
                  )
          PY

          # Negative control: ensure heredoc assertions do execute in Docker.
          if docker run --rm -i --entrypoint /usr/bin/python3 mcphub-addon:test - <<'PY'
          raise AssertionError("Container stdin test must fail")
          PY
          then
            echo "Docker container ignored Python stdin" >&2
            exit 1
          fi

          grep -q 'allow 172.30.32.2;' "MCPHub/ingress.conf"

      - name: Validate restricted Cloudflare proxy
        run: |
          data_dir="$(mktemp -d)"
          mkdir -p "${data_dir}/secrets" "${data_dir}/mcphub"
          cat > "${data_dir}/options.json" <<'EOF'
          {
            "cloudflare_tunnel_enabled": true,
            "cloudflare_mcp_path": "/mcp/$smart/development",
            "cloudflare_access_token": "test_client_key_0123456789abcdefghijklmnop"
          }
          EOF

          docker run --rm \
            --entrypoint /bin/bash \
            --volume "${data_dir}:/data" \
            mcphub-addon:test \
            -c '/usr/local/bin/prepare_mcphub_config.py &&
                /usr/local/bin/prepare_proxy_config.py &&
                nginx -t &&
                grep -q "listen 127.0.0.1:8098" /etc/nginx/conf.d/mcphub.conf'

      - name: MCPHub container integration test
        run: bash .github/scripts/integration-test-mcphub.sh mcphub-addon:test

      - name: Show Docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker network ls || true
          docker volume ls || true
