---
name: Validate MCPHub

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mcphub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and integration-test MCPHub
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            'pyyaml==6.0.2' \
            'yamllint==1.37.1'

      - name: Lint MCPHub YAML
        run: |
          find "MCPHub" \
            -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -print0 \
            | xargs -0 yamllint

      - name: Lint MCPHub shell scripts
        run: |
          shellcheck "MCPHub/run.sh"
          shellcheck "MCPHub/github_cli_mcp.sh"
          shellcheck ".github/scripts/integration-test-mcphub.sh"
          shellcheck ".github/scripts/haos-e2e-mcphub.sh"

      - name: Compile MCPHub Python helpers
        run: |
          python3 -m py_compile "MCPHub/prepare_config.py"
          python3 -m py_compile "MCPHub/prepare_proxy_config.py"
          python3 -m py_compile "MCPHub/patch_home_assistant_auth.py"
          python3 -m py_compile ".github/scripts/update-mcphub-upstream.py"

      - name: Lint MCPHub Dockerfile
        run: |
          image="ghcr.io/hadolint/hadolint:v2.15.0-debian"
          digest="sha256:cc00266a16707bbbdfd29517cccd76164ac46a956e2ba8222515df5691fa54b5"
          docker run --rm -i "${image}@${digest}" \
            hadolint \
            --ignore DL3002 \
            --ignore DL3006 \
            --ignore DL3008 \
            --ignore DL3066 \
            - < "MCPHub/Dockerfile"

      - name: Validate MCPHub metadata
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import re
          import yaml

          config = yaml.safe_load(Path("MCPHub/config.yaml").read_text(encoding="utf-8"))
          build = yaml.safe_load(Path("MCPHub/build.yaml").read_text(encoding="utf-8"))
          changelog = Path("MCPHub/CHANGELOG.md").read_text(encoding="utf-8")

          assert config["name"] == "MCPHub"
          assert config["slug"] == "mcphub"
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert "image" not in config
          assert config["ingress"] is True
          assert config["ingress_port"] == 8099
          assert config["panel_admin"] is True

          version = config["version"]
          match = re.fullmatch(r"(v\d{4}\.\d{2}\.\d{2})(?:-([1-9]\d*))?", version)
          assert match is not None, (
              "MCPHub version must use vYYYY.MM.DD or vYYYY.MM.DD-N"
          )
          datetime.strptime(match.group(1), "v%Y.%m.%d")
          assert f"## [{version}]" in changelog

          assert config["options"]["tunnel_enabled"] is False
          assert config["options"]["cloudflare_tunnel_enabled"] is False
          assert config["options"]["cloudflare_mcp_path"] == "/mcp"
          assert list(config["options"])[-1] == "tunnel_log_level"
          assert list(config["schema"])[-1] == "tunnel_log_level"

          expected = "samanhappy/mcphub:1.1.1"
          assert build["build_from"] == {
              "amd64": expected,
              "aarch64": expected,
          }
          PY

          MCPHUB_VERSION="$(python3 - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path("MCPHub/config.yaml").read_text(encoding="utf-8"))
          print(config["version"])
          PY
          )"
          echo "MCPHUB_VERSION=${MCPHUB_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate upstream image architectures
        run: |
          docker manifest inspect "docker.io/samanhappy/mcphub:1.1.1" > /tmp/mcphub-manifest.json
          docker manifest inspect "ghcr.io/openai/tunnel-client:v0.0.15" > /tmp/tunnel-manifest.json
          docker manifest inspect "docker.io/cloudflare/cloudflared:2026.9.3" > /tmp/cloudflared-manifest.json

          python3 - <<'PY'
          import json

          required = {"amd64", "arm64"}

          for name, path in (
              ("MCPHub", "/tmp/mcphub-manifest.json"),
              ("OpenAI tunnel-client", "/tmp/tunnel-manifest.json"),
              ("Cloudflare cloudflared", "/tmp/cloudflared-manifest.json"),
          ):
              with open(path, encoding="utf-8") as handle:
                  manifest = json.load(handle)

              arches = {
                  item.get("platform", {}).get("architecture")
                  for item in manifest.get("manifests", [])
                  if item.get("platform", {}).get("os") == "linux"
              }
              missing = required - arches
              if missing:
                  raise SystemExit(
                      f"{name} is missing required Linux architectures: "
                      + ", ".join(sorted(missing))
                  )
              print(f"{name} Linux architectures: {sorted(arches)}")
          PY

      - name: Validate amd64 and aarch64 builds
        run: |
          docker buildx create \
            --driver docker-container \
            --name mcphub-ci \
            --use

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=amd64 \
            --output type=cacheonly \
            "MCPHub"

          docker buildx build \
            --pull \
            --platform linux/arm64 \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=aarch64 \
            --output type=cacheonly \
            "MCPHub"

      - name: Build native MCPHub test image
        run: |
          docker build --pull \
            --build-arg BUILD_VERSION="${MCPHUB_VERSION}" \
            --build-arg BUILD_ARCH=amd64 \
            --tag mcphub-addon:test \
            "MCPHub"

      - name: Verify bundled clients
        run: |
          docker run --rm --entrypoint /usr/local/bin/cloudflared mcphub-addon:test version
          docker run --rm --entrypoint /usr/local/bin/tunnel-client mcphub-addon:test --version
          docker run --rm --entrypoint /usr/local/bin/gh mcphub-addon:test --version \
            | grep -q 'gh version 2.101.0'
          docker run --rm -i \
            --entrypoint /opt/gh-cli-mcp/bin/python \
            mcphub-addon:test - <<'PY'
          import importlib.metadata as md
          from gh_cli_mcp_server.server import mcp

          assert mcp is not None
          assert md.version("gh-cli-mcp-server") == "0.3.0"
          assert md.version("mcp") == "1.30.0"
          PY

      - name: Smoke-test GitHub CLI MCP server
        run: |
          docker run --rm -i --entrypoint /usr/bin/python3 mcphub-addon:test - <<'PY'
          import subprocess
          import time

          proc = subprocess.Popen(
              ["/usr/local/bin/github_cli_mcp.sh"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          try:
              time.sleep(2)
              if proc.poll() is not None:
                  stdout, stderr = proc.communicate(timeout=1)
                  raise SystemExit(
                      "GitHub CLI MCP server exited during startup "
                      f"with code {proc.returncode}\nstdout:\n{stdout}\nstderr:\n{stderr}"
                  )
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=3)

          stderr = proc.stderr.read() if proc.stderr else ""
          if "Starting gh-cli-mcp-server 0.3.0" not in stderr:
              raise SystemExit(f"Unexpected GitHub CLI MCP stderr:\n{stderr}")
          PY

      - name: Validate restricted Cloudflare proxy
        run: |
          data_dir="$(mktemp -d)"
          mkdir -p "${data_dir}/secrets" "${data_dir}/mcphub"
          cat > "${data_dir}/options.json" <<'EOF'
          {
            "cloudflare_tunnel_enabled": true,
            "cloudflare_mcp_path": "/mcp/$smart/development",
            "cloudflare_access_token": "test_client_key_0123456789abcdefghijklmnop"
          }
          EOF

          docker run --rm \
            --entrypoint /bin/bash \
            --volume "${data_dir}:/data" \
            mcphub-addon:test \
            -c '/usr/local/bin/prepare_mcphub_config.py &&
                /usr/local/bin/prepare_proxy_config.py &&
                nginx -t &&
                grep -q "listen 127.0.0.1:8098" /etc/nginx/conf.d/mcphub.conf'

      - name: MCPHub container integration test
        run: bash .github/scripts/integration-test-mcphub.sh mcphub-addon:test

      - name: Show Docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker network ls || true
          docker volume ls || true
